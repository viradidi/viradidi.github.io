name: Build downloadable CV
on:
  push:
    branches:
      - main
    paths:
      - cv.html
      - scripts/build_cv_pdf.py
      - .github/workflows/build-cv-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF builder
        run: python -m pip install "reportlab==4.4.9"

      - name: Generate downloadable CV
        run: python scripts/build_cv_pdf.py

      - name: Commit refreshed PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume/Isaiah-Nyakundi-Data-Engineer-Resume.pdf
          if git diff --cached --quiet; then
            echo "The downloadable CV is already up to date."
          else
            git commit -m "build: refresh downloadable CV"
            git push
          fi

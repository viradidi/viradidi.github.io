name: Build downloadable CV
on:
  push:
    branches:
      - main
    paths:
      - cv.html
      - scripts/build_cv_pdf.py
      - scripts/build_cv_docx.py
      - .github/workflows/build-cv-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CV builders
        run: python -m pip install "reportlab==4.4.9" "beautifulsoup4==4.14.3" "python-docx==1.2.0"

      - name: Generate editable DOCX
        run: python scripts/build_cv_docx.py

      - name: Generate downloadable PDF
        run: python scripts/build_cv_pdf.py

      - name: Commit refreshed resume files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume/Isaiah-Nyakundi-Data-Engineer-Resume.pdf resume/Isaiah_Nyakundi_Data_Engineer_Resume.docx
          if git diff --cached --quiet; then
            echo "The downloadable CV files are already up to date."
          else
            git commit -m "build: refresh downloadable CV files"
            git push
          fi
